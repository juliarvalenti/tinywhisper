[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinywhisper"
version = "0.1.0"
description = "Local voice-to-text for macOS Apple Silicon — powered by MLX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["voice", "speech-to-text", "whisper", "parakeet", "mlx", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyQt6>=6.6",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24",
    "pyperclip>=1.8",
    "pyyaml>=6.0",
    "dacite>=1.8",
    "parakeet-mlx>=0.1",
    "pyobjc-framework-ServiceManagement>=9.0",
    "pyobjc-framework-AVFoundation>=9.0",
    "pynput>=1.7",
]

[project.optional-dependencies]
whisper = ["mlx-whisper>=0.4"]
tidier = ["mlx-lm>=0.14"]

[dependency-groups]
dev = ["ruff>=0.8", "pyright>=1.1", "build>=1.0", "pytest>=8.0"]

[project.scripts]
tinywhisper = "tinywhisper.main:main"

[tool.pytest.ini_options]
markers = ["build: tests that compile the .app bundle (slow)"]

[tool.setuptools.packages.find]
include = ["tinywhisper*"]

[tool.setuptools.package-data]
tinywhisper = ["*.jpg", "*.png"]

[project.urls]
Homepage = "https://github.com/juliarvalenti/tinywhisper"
Repository = "https://github.com/juliarvalenti/tinywhisper"
