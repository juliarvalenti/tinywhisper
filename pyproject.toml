[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinywhisper"
version = "0.1.0"
description = "Local voice-to-text for macOS Apple Silicon — powered by MLX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["voice", "speech-to-text", "whisper", "parakeet", "mlx", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyQt6>=6.6",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24",
    "pyperclip>=1.8",
    "pyyaml>=6.0",
    "dacite>=1.8",
    "parakeet-mlx>=0.1",
]

[project.optional-dependencies]
whisper = ["mlx-whisper>=0.4"]

[project.scripts]
tinywhisper = "tinywhisper.main:main"

[project.urls]
Homepage = "https://github.com/juliarvalenti/tinywhisper"
Repository = "https://github.com/juliarvalenti/tinywhisper"
