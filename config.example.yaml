hotkey:
  modifier: "option"       # option, ctrl, cmd, shift
  key: "space"             # space, tab, f1-f12, etc.

transcription:
  engine: "parakeet"       # or "whisper"
  parakeet:
    model: "mlx-community/parakeet-tdt-0.6b-v3"
  whisper:
    model: "mlx-community/whisper-large-v3-turbo"

recording:
  sample_rate: 16000
  channels: 1

overlay:
  enabled: true
  width: 300
  height: 60
  position: "top-center"
  opacity: 0.85
  color: "#FF6B6B"
  bg_color: "#1E1E1E"

# Optional local LLM to tidy up transcribed text
# (fix punctuation, capitalization, remove filler words)
# Requires: pip install "tinywhisper[tidier]"
tidier:
  enabled: false
  model: "mlx-community/Qwen2.5-0.5B-Instruct-4bit"  # ~300 MB, fast on Apple Silicon
  prompt: ""          # empty = default cleanup prompt
  max_tokens: 512
